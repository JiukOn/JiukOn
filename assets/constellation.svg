                <animate attributeName="stroke-dasharray" from="0, 500" to="500, 0" dur="10s" repeatCount="indefinite" />
            </line>
        
            <line x1="512.95094355605" y1="232.06366407180337" x2="439.0044220343999" y2="270.0432675723083" 
                stroke="url(#lineGrad)" stroke-width="1.5078515036733164" opacity="0.15">
